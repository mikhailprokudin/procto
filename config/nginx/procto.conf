# Nginx для одностраничного лендинга ПРОКТОБАБОЧКА (Nuxt).
#
# Сборка перед деплоем:
#   npm ci && npm run generate
#
# Сертификаты Let's Encrypt (после certbot certonly):
#   /etc/letsencrypt/live/proctobabochka.ru/fullchain.pem
#   /etc/letsencrypt/live/proctobabochka.ru/privkey.pem

# --- HTTP → HTTPS, www → без www ---

server {
    listen 80;
    listen [::]:80;
    server_name www.proctobabochka.ru;

    return 301 https://proctobabochka.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name proctobabochka.ru;

    return 301 https://proctobabochka.ru$request_uri;
}

# --- HTTPS www → без www ---

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.proctobabochka.ru;

    ssl_certificate /etc/letsencrypt/live/proctobabochka.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proctobabochka.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://proctobabochka.ru$request_uri;
}

# --- Основной сайт (HTTPS, без www) ---

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name proctobabochka.ru;

    ssl_certificate /etc/letsencrypt/live/proctobabochka.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proctobabochka.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/proctobabochka/.output/public;
    index index.html;

    charset utf-8;
    client_max_body_size 1m;

    access_log /var/log/nginx/procto.access.log;
    error_log /var/log/nginx/procto.error.log warn;

    # Путь без завершающего слэша → со слэшем (не трогаем URI с расширением файла)
    rewrite ^([^.]*[^/])$ $1/ permanent;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Изображения — 7 суток
    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Видео — 3 суток
    location ~* \.(?:mp4|webm|ogv|mov)$ {
        expires 3d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # HTML-документ — 1 сутки
    location ~* \.html?$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Прочая статика (CSS, JS, шрифты, manifest) — 1 сутки
    location ~* \.(?:css|js|mjs|map|json|xml|txt|woff2?|ttf|eot|webmanifest)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires 1d;
        add_header Cache-Control "public";
    }
}

